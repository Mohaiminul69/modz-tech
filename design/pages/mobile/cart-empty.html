<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Empty cart</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&amp;family=Sora:wght@400;600;700&amp;display=swap">
<style>
body{margin:0;background:#f4f6f9}
a{color:#1f5bc4}a:hover{color:#2563d0}
</style>
</helmet>
<div style="width: 390px; background: #f4f6f9; color: #0b0f16; font-family: 'Hind Siliguri', system-ui, sans-serif; font-size: 15px; line-height: 24px; display: flex; flex-direction: column;">

  <header style="background: #05060a; display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid #2c3440;">
    <a href="home.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #d9dade;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
    <a href="home.html" aria-label="Modz Tech home"><img src="../../assets/logos/modz-tech-wordmark.webp" alt="Modz Tech" style="height: 32px; width: auto; display: block;"></a>
    <a href="shop.html" aria-label="Search" style="margin-left: auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #d9dade;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></a>
  </header>

  <section style="padding: 56px 24px 40px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;">
    <span style="width: 112px; height: 112px; border-radius: 999px; background: #e8f0fd; display: flex; align-items: center; justify-content: center;">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#1f5bc4" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.4 11.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.5L22 7H6"/></svg>
    </span>
    <h1 style="margin: 12px 0 0; font-family: Sora, sans-serif; font-size: 24px; line-height: 30px; font-weight: 700; letter-spacing: -0.02em;">Your cart is empty.</h1>
    <p style="margin: 0; max-width: 300px; font-size: 15px; line-height: 24px; color: #4f5968;">Find something you'll love. Cash on delivery all over Bangladesh.</p>
    <a href="shop.html" style="margin-top: 8px; height: 48px; padding: 0 32px; display: inline-flex; align-items: center; justify-content: center; border-radius: 8px; background: #2563d0; color: #ffffff; font-size: 15px; font-weight: 600; text-decoration: none;">Start shopping</a>
  </section>

  <section style="padding: 0 0 32px; display: flex; flex-direction: column; gap: 12px;">
    <div style="padding: 0 16px; display: flex; align-items: baseline; justify-content: space-between;">
      <h2 style="margin: 0; font-family: Sora, sans-serif; font-size: 18px; line-height: 24px; font-weight: 700; letter-spacing: -0.02em;">Popular right now</h2>
      <a href="shop.html" style="font-size: 14px; line-height: 20px; font-weight: 600; text-decoration: none;">Show all</a>
    </div>
    <div style="display: flex; gap: 12px; padding: 0 16px; overflow-x: auto;">
      <sc-for list="{{items}}" as="p" hint-placeholder-count="4">
        <a href="product.html" style="flex: none; width: 160px; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #dde2e9; border-radius: 12px; box-shadow: 0 1px 2px rgba(11,15,22,0.06), 0 6px 18px rgba(11,15,22,0.08); overflow: hidden; text-decoration: none; color: #0b0f16;">
          <img src="{{p.img}}" alt="{{p.name}}" style="width: 160px; height: 160px; object-fit: cover; object-position: {{p.pos}}; display: block; background: #eef1f5;">
          <div style="padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px;">
            <span style="font-size: 14px; line-height: 20px; color: #4f5968; height: 40px; overflow: hidden;">{{p.name}}</span>
            <span style="font-family: Sora, sans-serif; font-size: 18px; line-height: 22px; font-weight: 700;">{{p.price}}</span>
          </div>
        </a>
      </sc-for>
    </div>
  </section>

  <footer style="background: #05060a; color: #9aa3b0; padding: 24px 16px 20px; display: flex; flex-direction: column; gap: 8px; font-size: 12px; line-height: 16px;">
    <span>Phone: [YOUR PHONE NUMBER] · <a href="#" style="color: #66aae7; text-decoration: none;">facebook.com/ModzTech</a></span>
    <span><a href="contact.html" style="color: #66aae7; text-decoration: none;">Contact us</a> · © 2026 Modz Tech</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { img: '../../assets/product-posts/post-hoco-eq34-plus.webp', pos: 'center 60%', name: 'Hoco EQ34 Plus ANC + ENC Earbuds', price: '৳729' },
        { img: '../../assets/product-posts/post-boombox-blue.webp', pos: 'center 62%', name: 'Boombox Bluetooth Speaker, Blue', price: '৳[price]' },
        { img: '../../assets/product-posts/post-y80-ultra-watch.webp', pos: 'center 55%', name: 'Y80 Ultra Smart Watch', price: '৳[price]' },
        { img: '../../assets/product-posts/post-hoco-e103-tracker.webp', pos: '62% 50%', name: 'Hoco E103 Anti-lost Tracker', price: '৳[price]' }
      ]
    };
  }
}
</script>
</body>
</html>
