<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shop filters</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&amp;family=Sora:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1f5bc4}a:hover{color:#2563d0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #4b5059; color: #0b0f16; font-family: 'Hind Siliguri', system-ui, sans-serif; font-size: 15px; line-height: 24px;">
  <div aria-hidden="true" style="height: 72px; background: #05060a;"></div>

  <div role="dialog" aria-label="Filter products" style="position: absolute; left: 0; right: 0; bottom: 0; height: 760px; background: #ffffff; border-radius: 16px 16px 0 0; display: flex; flex-direction: column;">
    <div style="display: flex; justify-content: center; padding-top: 8px;" aria-hidden="true"><span style="width: 40px; height: 4px; border-radius: 999px; background: #dde2e9;"></span></div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px 16px 12px; border-bottom: 1px solid #dde2e9;">
      <h1 style="margin: 0; font-family: Sora, sans-serif; font-size: 20px; line-height: 26px; font-weight: 700; letter-spacing: -0.02em;">Filter</h1>
      <a href="shop.html" aria-label="Close filters" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #0b0f16;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></a>
    </div>

    <div style="flex: 1; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 20px;">
      <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px;">
        <legend style="padding: 0 0 8px; font-family: Sora, sans-serif; font-size: 16px; line-height: 22px; font-weight: 600;">Category</legend>
        <div style="display: flex; flex-wrap: wrap; gap: 8px;">
          <sc-for list="{{cats}}" as="c" hint-placeholder-count="9">
            <span style="height: 36px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: 999px; background: {{c.bg}}; color: {{c.ink}}; border: 1px solid {{c.line}}; font-size: 14px; font-weight: 500;">{{c.label}}</span>
          </sc-for>
        </div>
      </fieldset>

      <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 8px;">
        <legend style="padding: 0 0 8px; font-family: Sora, sans-serif; font-size: 16px; line-height: 22px; font-weight: 600;">Price</legend>
        <div style="display: flex; align-items: center; gap: 8px;">
          <label style="flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 12px; line-height: 16px; color: #4f5968;">Min (৳)<input type="text" value="0" style="height: 44px; padding: 0 12px; border: 1px solid #848d9b; border-radius: 8px; font: 600 15px Sora, sans-serif; color: #0b0f16;"></label>
          <span style="padding-top: 20px; color: #4f5968;">–</span>
          <label style="flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 12px; line-height: 16px; color: #4f5968;">Max (৳)<input type="text" value="5,000" style="height: 44px; padding: 0 12px; border: 1px solid #848d9b; border-radius: 8px; font: 600 15px Sora, sans-serif; color: #0b0f16;"></label>
        </div>
      </fieldset>

      <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px;">
        <legend style="padding: 0 0 8px; font-family: Sora, sans-serif; font-size: 16px; line-height: 22px; font-weight: 600;">Brand</legend>
        <label style="display: flex; align-items: center; gap: 12px; height: 40px; font-size: 15px;"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #2563d0; margin: 0;">Hoco</label>
        <label style="display: flex; align-items: center; gap: 12px; height: 40px; font-size: 15px;"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #2563d0; margin: 0;">Anker</label>
        <label style="display: flex; align-items: center; gap: 12px; height: 40px; font-size: 15px;"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #2563d0; margin: 0;">Other brands</label>
      </fieldset>

      <fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column; gap: 4px;">
        <legend style="padding: 0 0 8px; font-family: Sora, sans-serif; font-size: 16px; line-height: 22px; font-weight: 600;">Availability</legend>
        <label style="display: flex; align-items: center; gap: 12px; height: 40px; font-size: 15px;"><input type="checkbox" checked style="width: 20px; height: 20px; accent-color: #2563d0; margin: 0;">In stock only</label>
        <label style="display: flex; align-items: center; gap: 12px; height: 40px; font-size: 15px;"><input type="checkbox" style="width: 20px; height: 20px; accent-color: #2563d0; margin: 0;">On sale</label>
      </fieldset>
    </div>

    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 8px; padding: 12px 16px 20px; border-top: 1px solid #dde2e9;">
      <button style="height: 48px; border-radius: 8px; border: 1px solid #848d9b; background: #ffffff; color: #0b0f16; font: 600 15px 'Hind Siliguri', sans-serif;">Reset</button>
      <a href="shop.html" style="height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #2563d0; color: #ffffff; font-size: 15px; font-weight: 600; text-decoration: none;">Show [N] products</a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var on = ['Earbuds'];
    var all = ['Earbuds', 'Covers', 'Speakers', 'Karaoke', 'Mics', 'Watches', 'Trackers', 'Adapters', 'Chargers'];
    return {
      cats: all.map(function (l) {
        var sel = on.indexOf(l) >= 0;
        return { label: l, bg: sel ? '#e8f0fd' : '#ffffff', ink: sel ? '#1f5bc4' : '#0b0f16', line: sel ? '#1f5bc4' : '#848d9b' };
      })
    };
  }
}
</script>
</body>
</html>
