<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Modz Tech shop</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&amp;family=Saira:wght@600&amp;family=Sora:wght@400;600;700&amp;display=swap">
<style>
body{margin:0;background:#f4f6f9}
a{color:#1f5bc4}a:hover{color:#2563d0}
</style>
</helmet>
<div style="width: 390px; background: #f4f6f9; color: #0b0f16; font-family: 'Hind Siliguri', system-ui, sans-serif; font-size: 15px; line-height: 24px; display: flex; flex-direction: column;">

  <!-- Dark header -->
  <header style="background: #05060a; display: flex; flex-direction: column; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #2c3440;">
    <div style="display: flex; align-items: center; gap: 8px;">
      <a href="home.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #d9dade;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
      <a href="home.html" aria-label="Modz Tech home"><img src="../../assets/logos/modz-tech-wordmark.webp" alt="Modz Tech" style="height: 32px; width: auto; display: block;"></a>
      <a href="cart.html" aria-label="Cart, 2 items" style="margin-left: auto; position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #d9dade;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.4 11.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.5L22 7H6"/></svg><span style="position: absolute; top: 5px; right: 3px; min-width: 18px; height: 18px; border-radius: 999px; background: #66aae7; color: #05060a; font: 700 11px/18px Sora, sans-serif; text-align: center;">2</span></a>
    </div>
    <label style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; background: #141922; border: 1px solid #2c3440; border-radius: 8px; color: #9aa3b0;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" placeholder="Search earbuds, chargers, watches…" aria-label="Search products" style="flex: 1; min-width: 0; background: transparent; border: 0; color: #eef1f5; font: inherit; outline: none;">
    </label>
  </header>

  <!-- Title -->
  <section style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 4px;">
    <nav aria-label="Breadcrumb" style="font-size: 12px; line-height: 16px; color: #4f5968; display: flex; gap: 6px;"><a href="home.html" style="text-decoration: none;">Home</a><span aria-hidden="true">/</span><span style="color: #0b0f16;">Shop</span></nav>
    <h1 style="margin: 4px 0 0; font-family: Sora, sans-serif; font-size: 26px; line-height: 32px; font-weight: 700; letter-spacing: -0.02em;">All products</h1>
    <span style="font-size: 14px; line-height: 20px; color: #4f5968;">[N] products</span>
  </section>

  <!-- Category chips -->
  <div style="display: flex; gap: 8px; padding: 16px; overflow-x: auto;">
    <span style="flex: none; height: 36px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: 999px; background: #e8f0fd; color: #1f5bc4; border: 1px solid #1f5bc4; font-size: 14px; font-weight: 600;">All</span>
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
      <a href="#" style="flex: none; height: 36px; padding: 0 14px; display: inline-flex; align-items: center; border-radius: 999px; background: #ffffff; color: #0b0f16; border: 1px solid #848d9b; font-size: 14px; font-weight: 500; text-decoration: none;">{{c}}</a>
    </sc-for>
  </div>

  <!-- Filter / sort bar -->
  <div style="position: sticky; top: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: #ffffff; border-top: 1px solid #dde2e9; border-bottom: 1px solid #dde2e9;">
    <a href="shop-filters-open.html" style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; color: #0b0f16; text-decoration: none; font-size: 14px; font-weight: 600; border-right: 1px solid #dde2e9;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>Filter <span style="min-width: 20px; height: 20px; border-radius: 999px; background: #2563d0; color: #ffffff; font: 600 11px/20px Sora, sans-serif; text-align: center;">2</span></a>
    <button style="height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px; background: transparent; border: 0; color: #0b0f16; font: 600 14px/20px 'Hind Siliguri', sans-serif;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/></svg>Sort: Newest</button>
  </div>

  <!-- Applied filters -->
  <div style="display: flex; gap: 8px; padding: 12px 16px 0; flex-wrap: wrap; align-items: center;">
    <span style="height: 32px; padding: 0 6px 0 12px; display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; background: #e8f0fd; color: #0b0f16; font-size: 13px; line-height: 18px;">Hoco <button aria-label="Remove Hoco filter" style="width: 28px; height: 28px; background: transparent; border: 0; color: #4f5968; font-size: 16px;">×</button></span>
    <span style="height: 32px; padding: 0 6px 0 12px; display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; background: #e8f0fd; color: #0b0f16; font-size: 13px; line-height: 18px;">In stock <button aria-label="Remove In stock filter" style="width: 28px; height: 28px; background: transparent; border: 0; color: #4f5968; font-size: 16px;">×</button></span>
    <button style="height: 32px; padding: 0 4px; background: transparent; border: 0; color: #1f5bc4; font: 600 13px/18px 'Hind Siliguri', sans-serif;">Clear all</button>
  </div>

  <!-- Grid -->
  <section style="padding: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
    <sc-for list="{{items}}" as="p" hint-placeholder-count="8">
      <a href="product.html" style="position: relative; display: flex; flex-direction: column; background: #ffffff; border: 1px solid #dde2e9; border-radius: 12px; box-shadow: 0 1px 2px rgba(11,15,22,0.06), 0 6px 18px rgba(11,15,22,0.08); overflow: hidden; text-decoration: none; color: #0b0f16;">
        <div style="aspect-ratio: 1 / 1; background: #eef1f5;"><img src="{{p.img}}" alt="{{p.name}}" style="width: 100%; height: 100%; object-fit: cover; object-position: {{p.pos}}; display: block;"></div>
        <sc-if value="{{p.sale}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 8px; left: 8px; background: #f07800; color: #0b0b0b; font: 600 11px/16px Sora, sans-serif; padding: 2px 8px; border-radius: 4px;">Sale</span></sc-if>
        <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; flex: 1;">
          <span style="font-size: 14px; line-height: 20px; color: #4f5968; height: 40px; overflow: hidden;">{{p.name}}</span>
          <div style="display: flex; align-items: baseline; gap: 6px; margin-top: auto; padding-top: 4px; font-family: Sora, sans-serif;">
            <span style="font-size: 18px; line-height: 22px; font-weight: 700; letter-spacing: -0.01em;">{{p.price}}</span>
            <span style="font-size: 12px; line-height: 16px; color: #4f5968; text-decoration: line-through;">{{p.was}}</span>
          </div>
          <span style="margin-top: 8px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: #ffffff; color: #0b0f16; border: 1px solid #848d9b; font-size: 14px; font-weight: 600;">Add to cart</span>
        </div>
      </a>
    </sc-for>
  </section>

  <div style="padding: 0 16px 32px; display: flex; flex-direction: column; align-items: center; gap: 8px;">
    <span style="font-size: 12px; line-height: 16px; color: #4f5968;">Showing 8 of [N]</span>
    <button style="width: 100%; height: 44px; border-radius: 8px; border: 1px solid #848d9b; background: #ffffff; color: #0b0f16; font: 600 14px/20px 'Hind Siliguri', sans-serif;">Load more</button>
  </div>

  <!-- Dark footer -->
  <footer style="background: #05060a; color: #eef1f5; padding: 28px 16px 24px; display: flex; flex-direction: column; gap: 16px;">
    <img src="../../assets/logos/modz-tech-wordmark.webp" alt="Modz Tech" style="height: 44px; width: auto; align-self: flex-start; display: block;">
    <div style="display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 22px; color: #9aa3b0;">
      <span>Phone: [YOUR PHONE NUMBER]</span>
      <a href="#" style="color: #66aae7; text-decoration: none;">facebook.com/ModzTech</a>
    </div>
    <span style="font-size: 12px; line-height: 16px; color: #9aa3b0;"><a href="contact.html" style="color: #66aae7; text-decoration: none;">Contact us</a> · Cash on delivery available · © 2026 Modz Tech</span>
  </footer>

  <!-- Sticky bottom nav -->
  <nav aria-label="Main" style="position: sticky; bottom: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: #05060a; border-top: 1px solid #2c3440; padding: 6px 0 10px;">
    <a href="home.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; color: #d9dade; text-decoration: none; font-size: 12px; line-height: 16px; font-weight: 500;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 11 9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a href="shop.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; color: #66aae7; text-decoration: none; font-size: 12px; line-height: 16px; font-weight: 500;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Categories</a>
    <a href="cart.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; color: #d9dade; text-decoration: none; font-size: 12px; line-height: 16px; font-weight: 500;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.4 11.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.5L22 7H6"/></svg>Cart</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; color: #d9dade; text-decoration: none; font-size: 12px; line-height: 16px; font-weight: 500;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Message us</a>
  </nav>
</div>
</x-dc>

    var eq = { img: '../../assets/product-posts/post-hoco-eq34-plus.webp', pos: 'center 60%', name: 'Hoco EQ34 Plus ANC + ENC Earbuds', price: '৳729', was: '৳800', sale: true };

      cats: ['Earbuds', 'Covers', 'Speakers', 'Karaoke', 'Mics', 'Watches', 'Trackers', 'Adapters', 'Chargers'],

  }
}
</script>
</body>
</html>
